# ── Consent Service – QA Values ──

replicaCount: 2

service:
  type: NodePort
  port: 8084
  targetPort: 8084
  nodePort: 31005

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi

env:
  DB_HOST: medtrust-postgres
  DB_PORT: "5432"
  DB_DATABASE: consent_service
  DB_USERNAME: medtrust
  KAFKA_BROKER: medtrust-kafka:9092
  SPRING_PROFILES_ACTIVE: qa

secrets:
  DB_PASSWORD: qa-s3cur3-pwd

nodeSelector:
  workload: services

podAntiAffinity: true
