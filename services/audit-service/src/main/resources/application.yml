server:
    port: 8085

spring:
    application:
        name: audit-service

    datasource:
        url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_DATABASE:audit_service}
        username: ${DB_USERNAME:medtrust}
        password: ${DB_PASSWORD:changeme}
        driver-class-name: org.postgresql.Driver

    jpa:
        hibernate:
            ddl-auto: validate
        show-sql: true
        open-in-view: false
        properties:
            hibernate:
                format_sql: true
                dialect: org.hibernate.dialect.PostgreSQLDialect

    flyway:
        enabled: true
        locations: classpath:db/migration
        baseline-on-migrate: true

    kafka:
        bootstrap-servers: ${KAFKA_BROKER:localhost:29093}
        producer:
            key-serializer: org.apache.kafka.common.serialization.StringSerializer
            value-serializer: org.apache.kafka.common.serialization.StringSerializer
        consumer:
            group-id: ${KAFKA_GROUP_ID:audit-service-group}
            auto-offset-reset: earliest
            key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
            value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
            # Exactly-once semantics for audit reliability
            enable-auto-commit: false
        listener:
            ack-mode: record

resilience4j:
    circuitbreaker:
        configs:
            default:
                registerHealthIndicator: true
                slidingWindowType: COUNT_BASED
                slidingWindowSize: 10
                minimumNumberOfCalls: 5
                failureRateThreshold: 50
                waitDurationInOpenState: 30s
                permittedNumberOfCallsInHalfOpenState: 3
                automaticTransitionFromOpenToHalfOpenEnabled: true

management:
    endpoints:
        web:
            exposure:
                include: health,info,circuitbreakers,metrics
    endpoint:
        health:
            show-details: always
    health:
        circuitbreakers:
            enabled: true

logging:
    level:
        com.medtrust.audit: DEBUG
        org.hibernate.SQL: DEBUG
