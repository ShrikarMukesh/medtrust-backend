# ── Audit Service – DEV Values ──

replicaCount: 1

service:
  type: NodePort
  port: 8085
  targetPort: 8085
  nodePort: 30006

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 250m
    memory: 512Mi

env:
  DB_HOST: medtrust-postgres
  DB_PORT: "5432"
  DB_DATABASE: audit_service
  DB_USERNAME: medtrust
  KAFKA_BROKER: medtrust-kafka:9092
  SPRING_PROFILES_ACTIVE: dev

secrets:
  DB_PASSWORD: dev-changeme

nodeSelector:
  workload: services

podAntiAffinity: false
