server:
    port: 8087
spring:
    application:
        name: integration-service
    datasource:
        url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_DATABASE:integration_service}
        username: ${DB_USERNAME:medtrust}
        password: ${DB_PASSWORD:changeme}
        driver-class-name: org.postgresql.Driver
    jpa:
        hibernate:
            ddl-auto: validate
        show-sql: true
        open-in-view: false
        properties:
            hibernate:
                format_sql: true
                dialect: org.hibernate.dialect.PostgreSQLDialect
    flyway:
        enabled: true
        locations: classpath:db/migration
        baseline-on-migrate: true
    kafka:
        bootstrap-servers: ${KAFKA_BROKER:localhost:29093}
        producer:
            key-serializer: org.apache.kafka.common.serialization.StringSerializer
            value-serializer: org.apache.kafka.common.serialization.StringSerializer

resilience4j:
    circuitbreaker:
        configs:
            default:
                registerHealthIndicator: true
                slidingWindowSize: 10
                failureRateThreshold: 50
                waitDurationInOpenState: 30s
        instances:
            kafkaProducer:
                baseConfig: default
    retry:
        configs:
            default:
                maxAttempts: 3
                waitDuration: 1s
                enableExponentialBackoff: true
        instances:
            kafkaProducer:
                baseConfig: default

management:
    endpoints:
        web:
            exposure:
                include: health,info,circuitbreakers,metrics
    endpoint:
        health:
            show-details: always

logging:
    level:
        com.medtrust.integration: DEBUG
        ca.uhn.fhir: INFO
