apiVersion: v1
kind: Secret
metadata:
  name: {{ include "notification-service.fullname" . }}-secret
  namespace: {{ .Release.Namespace }}
  labels: {{- include "notification-service.labels" . | nindent 4 }}
type: Opaque
data:
  DB_PASSWORD: {{ .Values.secrets.DB_PASSWORD | b64enc | quote }}
  WHATSAPP_ACCESS_TOKEN: {{ .Values.secrets.WHATSAPP_ACCESS_TOKEN | b64enc | quote }}
  TWILIO_AUTH_TOKEN: {{ .Values.secrets.TWILIO_AUTH_TOKEN | b64enc | quote }}
  SMTP_PASSWORD: {{ .Values.secrets.SMTP_PASSWORD | b64enc | quote }}
