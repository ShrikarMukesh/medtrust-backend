apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "notification-service.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels: {{- include "notification-service.labels" . | nindent 4 }}
data:
  DB_HOST: {{ .Values.env.DB_HOST | quote }}
  DB_PORT: {{ .Values.env.DB_PORT | quote }}
  DB_DATABASE: {{ .Values.env.DB_DATABASE | quote }}
  DB_USERNAME: {{ .Values.env.DB_USERNAME | quote }}
  KAFKA_BROKER: {{ .Values.env.KAFKA_BROKER | quote }}
  WHATSAPP_ENABLED: {{ .Values.env.WHATSAPP_ENABLED | quote }}
  SMS_ENABLED: {{ .Values.env.SMS_ENABLED | quote }}
  EMAIL_ENABLED: {{ .Values.env.EMAIL_ENABLED | quote }}
