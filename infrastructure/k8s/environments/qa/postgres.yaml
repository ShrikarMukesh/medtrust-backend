# ── PostgreSQL for MedTrust (QA) ──
---
apiVersion: v1
kind: Secret
metadata:
  name: medtrust-postgres-secret
  namespace: medtrust-qa
  labels:
    app: medtrust-postgres
    environment: qa
type: Opaque
data:
  # "medtrust" base64 encoded
  POSTGRES_USER: bWVkdHJ1c3Q=
  # "qa-s3cur3-pwd" base64 encoded
  POSTGRES_PASSWORD: cWEtczNjdXIzLXB3ZA==

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: medtrust-postgres-init
  namespace: medtrust-qa
  labels:
    app: medtrust-postgres
    environment: qa
data:
  init.sql: |
    -- Single medtrust database with schema-per-service isolation
    CREATE SCHEMA IF NOT EXISTS auth         AUTHORIZATION medtrust;
    CREATE SCHEMA IF NOT EXISTS appointment  AUTHORIZATION medtrust;
    CREATE SCHEMA IF NOT EXISTS clinical     AUTHORIZATION medtrust;
    CREATE SCHEMA IF NOT EXISTS patient      AUTHORIZATION medtrust;
    CREATE SCHEMA IF NOT EXISTS consent      AUTHORIZATION medtrust;
    CREATE SCHEMA IF NOT EXISTS audit        AUTHORIZATION medtrust;
    CREATE SCHEMA IF NOT EXISTS notification AUTHORIZATION medtrust;
    CREATE SCHEMA IF NOT EXISTS integration  AUTHORIZATION medtrust;

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: medtrust-postgres-pvc
  namespace: medtrust-qa
  labels:
    app: medtrust-postgres
    environment: qa
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: medtrust-postgres
  namespace: medtrust-qa
  labels:
    app: medtrust-postgres
    environment: qa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: medtrust-postgres
  template:
    metadata:
      labels:
        app: medtrust-postgres
        environment: qa
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: medtrust-postgres-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: medtrust-postgres-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: medtrust
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - medtrust
                - -d
                - postgres
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - medtrust
                - -d
                - postgres
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: medtrust-postgres-pvc
        - name: init-scripts
          configMap:
            name: medtrust-postgres-init

---
apiVersion: v1
kind: Service
metadata:
  name: medtrust-postgres
  namespace: medtrust-qa
  labels:
    app: medtrust-postgres
    environment: qa
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
  selector:
    app: medtrust-postgres
